<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J-Exam Pro - Premium Edition</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    
    <style>
        :root { 
            --primary: #818cf8; 
            --success: #34d399; 
            --error: #fb7185; 
            --bg-dark: #0f172a; /* To'q ko'k fon */
            --glass: rgba(30, 41, 59, 0.7); /* Shishasimon to'q fon */
            --text: #f8fafc;
        }

        * { box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }

        body { 
            /* Yumshoqroq va chuqurroq gradient */
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617);
            margin: 0; 
            padding-bottom: 120px; 
            color: var(--text); 
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Orqa fondagi harakatlanuvchi nurlar (Atmosfera yaratish uchun) */
        body::before {
            content: "";
            position: fixed;
            top: -10%; left: -10%; width: 40%; height: 40%;
            background: var(--primary);
            filter: blur(150px);
            opacity: 0.15;
            z-index: -1;
            animation: moveLight 20s infinite alternate;
        }

        @keyframes moveLight {
            from { transform: translate(0, 0); }
            to { transform: translate(50vw, 50vh); }
        }

        .container { width: 100%; max-width: 700px; margin: 0 auto; padding: 20px; }

        /* Premium Glassmorphism Kartalar */
        .card { 
            background: var(--glass); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            padding: 30px; 
            border-radius: 28px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); 
            margin-bottom: 25px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            transition: 0.3s;
        }

        .top-bar { 
            position: sticky; top: 0; z-index: 100; 
            background: rgba(15, 23, 42, 0.8); 
            backdrop-filter: blur(10px); 
            padding: 15px 25px; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
        }

        #timer { 
            background: rgba(251, 113, 133, 0.1);
            color: var(--error); 
            font-weight: 700; 
            font-size: 18px; 
            padding: 5px 15px; 
            border-radius: 12px;
            border: 1px solid var(--error);
        }

        .option { 
            padding: 18px; 
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            margin: 12px 0; 
            border-radius: 18px; 
            cursor: pointer; 
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
            font-size: 16px; 
        }

        .option:hover { 
            background: rgba(255, 255, 255, 0.08); 
            border-color: var(--primary);
            transform: scale(1.02);
        }

        .option.selected { 
            background: var(--primary); 
            color: white; 
            border-color: var(--primary);
            box-shadow: 0 10px 20px rgba(129, 140, 248, 0.3);
        }
        
        .opt-correct { background: var(--success) !important; color: #022c22 !important; border-color: var(--success); }
        .opt-wrong { background: var(--error) !important; color: #450a0a !important; border-color: var(--error); }

        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: rgba(15, 23, 42, 0.9); 
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.1); padding: 20px; z-index: 1000; 
        }

        .q-grid { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 10px; scrollbar-width: none; }
        .q-grid::-webkit-scrollbar { display: none; }

        .q-num { 
            min-width: 45px; height: 45px; border-radius: 14px; 
            background: rgba(255,255,255,0.05); 
            display: flex; align-items: center; justify-content: center; 
            font-weight: bold; cursor: pointer; border: 1px solid rgba(255,255,255,0.1);
        }
        .q-num.done { background: var(--primary); border-color: var(--primary); }

        button { 
            background: var(--primary); color: white; border: none; padding: 18px; border-radius: 20px; 
            width: 100%; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        button:hover { filter: brightness(1.2); transform: translateY(-3px); }
        
        input {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 15px;
            border-radius: 15px;
            width: 100%;
            outline: none;
        }
        input:focus { border-color: var(--primary); }

        .btn-danger { background: var(--error); }
        .hidden { display: none !important; }
        
        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; margin-top: 15px; }
        th { color: #94a3b8; font-weight: 500; text-align: left; padding: 10px; }
        td { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px 0 0 12px; }
        td:last-child { border-radius: 0 12px 12px 0; }
    </style>
</head>
<body>

<div id="top-nav" class="top-bar hidden">
    <div id="user-display" style="font-weight: 600; font-size: 14px;"></div>
    <div id="timer">30:00</div>
</div>

<div class="container">
    <div id="login-screen" class="card" style="margin-top: 80px; text-align: center;">
        <h1 style="letter-spacing: 2px; margin-bottom: 5px;">J-EXAM <span style="color: var(--primary)">PRO</span></h1>
        <p style="color: #94a3b8; margin-bottom: 30px;">Bilimingizni sinash vaqti keldi</p>
        <input type="text" id="user-name" placeholder="Ism-familiyangizni yozing..." style="margin-bottom:20px; font-size:16px;">
        <button onclick="login()">BOSHLASH</button>
    </div>

    <div id="topic-screen" class="card hidden">
        <h2 style="margin-top:0">Mavzular</h2>
        <p style="color: #94a3b8; font-size: 14px;">Davom etish uchun test mavzusini tanlang:</p>
        <div id="test-list" style="margin-top: 20px;"></div>
        <button id="start-btn" class="hidden" onclick="startQuiz()" style="background:var(--success); margin-top:20px">TESTGA KIRISH</button>
    </div>

    <div id="admin-panel" class="card hidden">
        <h2 style="color: var(--error); margin-top:0">Boshqaruv Paneli</h2>
        
        <div class="admin-section">
            <h4 style="margin-bottom: 10px;">Yangi Test Yuklash</h4>
            <input type="text" id="new-test-name" placeholder="Mavzu nomi" style="margin-bottom:10px;">
            <input type="file" id="upload-file" accept=".docx" style="margin-bottom:15px; background: none; padding: 0;">
            <button onclick="handleFileUpload()" style="background:var(--success)">TIZIMGA QO'SHISH</button>
        </div>

        <div class="admin-section">
            <h4>Mavjud Testlar</h4>
            <div id="admin-topic-list"></div>
        </div>

        <div class="admin-section">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h4>Natijalar Jadvali</h4>
                <button onclick="clearAllResults()" class="del-btn" style="width: auto; padding: 5px 15px; background: rgba(251, 113, 133, 0.2); border: 1px solid var(--error); color: var(--error);">Tozalash</button>
            </div>
            <div style="overflow-x:auto;">
                <table>
                    <thead><tr><th>Ism</th><th>Vaqt</th><th>Natija</th><th>Mavzu</th></tr></thead>
                    <tbody id="results-body"></tbody>
                </table>
            </div>
        </div>
        
        <button onclick="location.reload()" style="background:none; color:#64748b; margin-top:30px; border: 1px solid #334155;">Chiqish</button>
    </div>

    <div id="questions-list" class="hidden"></div>

    <div id="result-screen" class="hidden">
        <div class="card" style="text-align: center;">
            <h2 id="res-status">Sizning Natijangiz</h2>
            <div id="score-circle" style="font-size: 64px; font-weight: 900; color: var(--primary); margin: 20px 0;">0%</div>
            <p id="res-detail" style="color: #94a3b8; font-size: 18px; margin-bottom: 30px;"></p>
            <button onclick="location.reload()">ASOSIY MENYU</button>
        </div>
        <div id="analysis-list"></div>
    </div>
</div>

<div id="bottom-bar" class="bottom-nav hidden">
    <div class="q-grid" id="q-grid"></div>
    <button class="btn-danger" onclick="confirmFinish()" style="padding: 15px;">TESTNI YAKUNLASH</button>
</div>

<script>
    // FIREBASE KONFIGURATSIYASI (API kalitni qayta joylang)
    const firebaseConfig = {
        apiKey: "AIzaSyBcn2bYdcDlWB-TFtuz5qWanO3aF_b9NCY",
        authDomain: "j-exam.firebaseapp.com",
        databaseURL: "https://j-exam-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "j-exam",
        storageBucket: "j-exam.firebasestorage.app",
        messagingSenderId: "370411029242",
        appId: "1:370411029242:web:3a677a92d2b4309a8dff43"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let uName = "", selectedTestId = "", testQs = [], userAns = {}, timer, timeLeft = 1800, loginTime = "";

    function login() {
        uName = document.getElementById('user-name').value.trim();
        if(!uName) return alert("Iltimos, ismingizni kiriting!");
        loginTime = new Date().toLocaleTimeString('uz-UZ', {hour: '2-digit', minute:'2-digit'});
        
        document.getElementById('login-screen').classList.add('hidden');
        if(uName === "admin777") {
            document.getElementById('admin-panel').classList.remove('hidden');
            loadAdminData();
        } else {
            document.getElementById('user-display').innerText = "O'quvchi: " + uName;
            document.getElementById('topic-screen').classList.remove('hidden');
            loadTests();
        }
    }

    function loadTests() {
        db.ref('tests').on('value', s => {
            let tests = s.val(), h = "";
            for(let id in tests) h += `<div onclick="selectTest('${id}')" class="option">${id}</div>`;
            document.getElementById('test-list').innerHTML = h || "Hozircha testlar yo'q.";
        });
    }

    function selectTest(id) {
        selectedTestId = id;
        document.getElementById('start-btn').classList.remove('hidden');
        document.querySelectorAll('#test-list .option').forEach(el => el.classList.remove('selected'));
        event.currentTarget.classList.add('selected');
    }

    function startQuiz() {
        db.ref('tests/' + selectedTestId).once('value', s => {
            if(!s.val()) return alert("Xatolik!");
            testQs = [...s.val()].sort(() => 0.5 - Math.random()).slice(0, 25).map(q => {
                let opts = q.options.map((t, i) => ({ t, isCorrect: i === q.correct }));
                opts.sort(() => 0.5 - Math.random());
                return { title: q.title, options: opts.map(o => o.t), correct: opts.findIndex(o => o.isCorrect) };
            });
            document.getElementById('topic-screen').classList.add('hidden');
            document.getElementById('top-nav').classList.remove('hidden');
            document.getElementById('questions-list').classList.remove('hidden');
            document.getElementById('bottom-bar').classList.remove('hidden');
            renderQuiz(); renderGrid(); startTimer();
        });
    }

    function renderQuiz() {
        let h = "";
        testQs.forEach((q, i) => {
            h += `<div class="card" id="q-card-${i}"><h3>${i+1}. ${q.title}</h3>`;
            q.options.forEach((o, oi) => h += `<div class="option" id="opt-${i}-${oi}" onclick="selectAnswer(${i}, ${oi})">${o}</div>`);
            h += `</div>`;
        });
        document.getElementById('questions-list').innerHTML = h;
    }

    function renderGrid() {
        let h = "";
        testQs.forEach((_, i) => h += `<div class="q-num" id="grid-num-${i}" onclick="scrollToQuestion(${i})">${i+1}</div>`);
        document.getElementById('q-grid').innerHTML = h;
    }

    function scrollToQuestion(i) {
        window.scrollTo({ top: document.getElementById(`q-card-${i}`).offsetTop - 100, behavior: 'smooth' });
    }

    function selectAnswer(qI, oI) {
        userAns[qI] = oI;
        document.querySelectorAll(`#q-card-${qI} .option`).forEach(el => el.classList.remove('selected'));
        document.getElementById(`opt-${qI}-${oI}`).classList.add('selected');
        document.getElementById(`grid-num-${qI}`).classList.add('done');
    }

    function startTimer() {
        timer = setInterval(() => {
            timeLeft--;
            let m = Math.floor(timeLeft/60), s = timeLeft%60;
            document.getElementById('timer').innerText = `${m}:${s<10?'0':''}${s}`;
            if(timeLeft <= 0) finishQuiz();
        }, 1000);
    }

    function confirmFinish() { if(confirm("Testni yakunlaysizmi?")) finishQuiz(); }

    function finishQuiz() {
        clearInterval(timer);
        let correctCount = 0;
        let analysisHTML = "";
        testQs.forEach((q, i) => {
            let isCorrect = userAns[i] === q.correct;
            if(isCorrect) correctCount++;
            analysisHTML += `<div class="card"><h4>${i+1}. ${q.title}</h4>`;
            q.options.forEach((o, oi) => {
                let cls = (oi === q.correct) ? "opt-correct" : (oi === userAns[i] ? "opt-wrong" : "");
                analysisHTML += `<div class="option ${cls}">${o}</div>`;
            });
            analysisHTML += `</div>`;
        });
        let percent = Math.round((correctCount / testQs.length) * 100);
        db.ref('results').push({ name: uName, percent, test: selectedTestId, time: loginTime, date: new Date().toLocaleDateString() });
        
        document.getElementById('top-nav').classList.add('hidden');
        document.getElementById('questions-list').classList.add('hidden');
        document.getElementById('bottom-bar').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('score-circle').innerText = percent + "%";
        document.getElementById('res-detail').innerText = `Siz 25 ta savoldan ${correctCount} tasiga javob berdingiz.`;
        document.getElementById('analysis-list').innerHTML = analysisHTML;
        window.scrollTo(0,0);
    }

    // ADMIN FUNKSIYALAR
    function loadAdminData() {
        db.ref('results').on('value', s => {
            let h = "";
            if(s.val()) Object.values(s.val()).reverse().forEach(r => {
                h += `<tr><td>${r.name}</td><td>${r.time}</td><td>${r.percent}%</td><td>${r.test}</td></tr>`;
            });
            document.getElementById('results-body').innerHTML = h;
        });
        db.ref('tests').on('value', s => {
            let h = "";
            if(s.val()) Object.keys(s.val()).forEach(id => {
                h += `<div style="display:flex; justify-content:space-between; margin-bottom:10px; background:rgba(255,255,255,0.05); padding:15px; border-radius:15px;">
                        <span>${id}</span>
                        <button onclick="deleteTest('${id}')" style="width:auto; padding:5px 15px; background:var(--error); font-size:12px;">O'chirish</button>
                      </div>`;
            });
            document.getElementById('admin-topic-list').innerHTML = h || "Testlar yo'q";
        });
    }

    async function handleFileUpload() {
        const file = document.getElementById('upload-file').files[0];
        const name = document.getElementById('new-test-name').value.trim();
        if(!file || !name) return alert("Ma'lumotlarni to'ldiring!");
        const reader = new FileReader();
        reader.onload = async (e) => {
            const res = await mammoth.extractRawText({ arrayBuffer: e.target.result });
            const lines = res.value.split('\n').map(l => l.trim()).filter(l => l !== "" && l !== "====");
            let quiz = [], curr = null;
            lines.forEach(l => {
                if(l.includes("++++")) { if(curr) quiz.push(curr); curr = { title: "", options: [], correct: 0 }; }
                else if(curr && curr.title === "") curr.title = l;
                else if(curr) {
                    if(l.startsWith("#")) { curr.correct = curr.options.length; curr.options.push(l.replace("#","").trim()); }
                    else curr.options.push(l);
                }
            });
            if(curr) quiz.push(curr);
            db.ref('tests/' + name).set(quiz).then(() => { alert("Tayyor!"); });
        };
        reader.readAsArrayBuffer(file);
    }

    function deleteTest(id) { if(confirm("O'chirilsinmi?")) db.ref('tests/' + id).remove(); }
    function clearAllResults() { if(confirm("Barchasini tozalash?")) db.ref('results').remove(); }
</script>
</body>
</html>
